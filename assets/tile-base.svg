<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="264" height="148" viewBox="0 0 264 148" role="img" aria-labelledby="t d">
<title id="t">Python + FastAPI</title><desc id="d">REST APIs, SQLAlchemy and LLM APIs.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0E1529"/><stop offset="1" stop-color="#080C18"/>
</linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#5EE6B8" stop-opacity="0.2"/><stop offset="1" stop-color="#5EE6B8" stop-opacity="0"/></radialGradient></defs>
<style>
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
