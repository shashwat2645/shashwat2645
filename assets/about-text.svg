<title id="t">About</title><desc id="d">Final-year CS (AI &amp; ML) student at PSIT Kanpur. I started out building Python / FastAPI backends and I&#x27;m now going deeper on Java and databases, the unglamorous parts that keep systems reliable.</desc>
