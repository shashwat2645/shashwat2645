<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="264" height="186" viewBox="0 0 264 186" role="img" aria-labelledby="t d">
<title id="t">Bhartiya Antariksha Hackathon 2026</title><desc id="d">Indian Space Research Organisation (ISRO) — Space tech &amp; innovation</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0E1529"/><stop offset="1" stop-color="#080C18"/>
</linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#B79BFF" stop-opacity="0.17"/><stop offset="1" stop-color="#B79BFF" stop-opacity="0"/></radialGradient></defs>
<style>
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
