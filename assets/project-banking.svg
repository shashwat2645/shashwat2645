<svg xmlns="http://www.w3.org/2000/svg" width="398" height="226" viewBox="0 0 398 226" role="img" aria-labelledby="t d">
<title id="t">Banking Transaction System</title><desc id="d">A banking backend for account balances, secure fund transfers and reliable transaction records.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0E1529"/><stop offset="1" stop-color="#080C18"/>
</linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#6EA8FF" stop-opacity="0.17"/><stop offset="1" stop-color="#6EA8FF" stop-opacity="0"/></radialGradient></defs>
<style>
.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
.cur{animation:blink 1.1s steps(1) infinite}
