name: Update stats

on:
  schedule:
    - cron: "17 2 * * *"      # daily, 07:47 IST
  workflow_dispatch:           # Actions tab -> Update stats -> Run workflow
  push:
    paths:
      - scripts/update_stats.py
      - scripts/theme.py

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/stats.svg
        env:
          # Optional: add a classic PAT as the STATS_TOKEN secret (scopes: read:user)
          # to include private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          LEETCODE_USER: shashwat_singh_2604
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats card" && git push)
